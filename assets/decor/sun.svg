<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!-- Outer soft rays -->
  <g stroke="#ffd166" stroke-width="5" opacity="0.45" stroke-linecap="round">
    <line x1="90" y1="4" x2="90" y2="26"/>
    <line x1="90" y1="154" x2="90" y2="176"/>
    <line x1="4" y1="90" x2="26" y2="90"/>
    <line x1="154" y1="90" x2="176" y2="90"/>
    <line x1="25" y1="25" x2="40" y2="40"/>
    <line x1="140" y1="140" x2="155" y2="155"/>
    <line x1="155" y1="25" x2="140" y2="40"/>
    <line x1="40" y1="140" x2="25" y2="155"/>
    <line x1="60" y1="12" x2="66" y2="30"/>
    <line x1="120" y1="12" x2="114" y2="30"/>
    <line x1="60" y1="168" x2="66" y2="150"/>
    <line x1="120" y1="168" x2="114" y2="150"/>
    <line x1="12" y1="60" x2="30" y2="66"/>
    <line x1="12" y1="120" x2="30" y2="114"/>
    <line x1="168" y1="60" x2="150" y2="66"/>
    <line x1="168" y1="120" x2="150" y2="114"/>
  </g>
  <!-- Inner bright rays -->
  <g stroke="#ffe08a" stroke-width="5" opacity="0.75" stroke-linecap="round">
    <line x1="90" y1="10" x2="90" y2="28"/>
    <line x1="90" y1="152" x2="90" y2="170"/>
    <line x1="10" y1="90" x2="28" y2="90"/>
    <line x1="152" y1="90" x2="170" y2="90"/>
    <line x1="31" y1="31" x2="47" y2="47"/>
    <line x1="133" y1="133" x2="149" y2="149"/>
    <line x1="149" y1="31" x2="133" y2="47"/>
    <line x1="47" y1="133" x2="31" y2="149"/>
  </g>
  <!-- Layered halo discs -->
  <circle cx="90" cy="90" r="58" fill="#ffd166" opacity="0.18"/>
  <circle cx="90" cy="90" r="52" fill="#ffd166" opacity="0.28"/>
  <circle cx="90" cy="90" r="40" fill="#ffd166"/>
  <circle cx="90" cy="90" r="31" fill="#fff0a8"/>
  <!-- Core highlight -->
  <circle cx="82" cy="82" r="10" fill="#fff8d6" opacity="0.9"/>
</svg>
